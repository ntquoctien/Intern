# Public Student ingress. Generic management APIs and direct service ports must remain internal/VPN-only.
upstream identity_service { server identity-service:8080; }
upstream academic_service { server academic-service:8080; }
upstream exam_service { server exam-service:8080; }
upstream communication_service { server communication-service:8080; }

server {
    listen 8080;
    server_name student-portal.internal;

    location = /api/auth/student/login { proxy_pass http://identity_service; }
    location = /api/student/me/session { proxy_pass http://identity_service; }

    location ~ ^/api/student/me/(profile|program|subjects|schedule|attendance)$ {
        proxy_pass http://academic_service;
    }
    location ~ ^/api/student/me/exam-results(?:/.*)?$ { proxy_pass http://exam_service; }
    location ~ ^/api/student/me/form-requests(?:/.*)?$ { proxy_pass http://communication_service; }

    # Fail closed for generic academic, exam, identity, communication, internal, and management routes.
    location ^~ /api/ { return 404; }
}
